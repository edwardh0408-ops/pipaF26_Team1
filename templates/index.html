<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Health Tracker</title>
  <style>
    body {
      font-family: Georgia, "Times New Roman", serif;
      margin: 2rem auto;
      max-width: 48rem;
      padding: 0 1rem;
      background: #fff;
      color: #1a1a1a;
      line-height: 1.4;
    }

    h1 {
      font-size: 1.75rem;
      margin: 0 0 1.25rem;
    }

    #message {
      margin: 0 0 1rem;
    }

    #message.error {
      color: #9b1c1c;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #d0d0d0;
    }

    th {
      border-bottom: 2px solid #1a1a1a;
    }

    .status-active {
      color: green;
    }

    .status-liquidation {
      color: orange;
    }

    .status-dissolved {
      color: gray;
    }

    #check-section {
      margin-top: 2rem;
    }

    #check-section h2 {
      font-size: 1.25rem;
      margin: 0 0 1rem;
    }

    #check-section input,
    #check-section button {
      font-family: inherit;
      padding: 0.35rem 0.5rem;
    }

    #check-result {
      margin-top: 0.75rem;
    }

    #check-result.error {
      color: #9b1c1c;
    }
  </style>
</head>
<body>
  <h1>Company Health Tracker</h1>
  <p id="message">Loading…</p>
  <table id="companies-table" hidden>
    <thead>
      <tr>
        <th>Company number</th>
        <th>Company</th>
        <th>Incorporated</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="companies-body"></tbody>
  </table>

  <section id="check-section">
    <h2>Check a company before offering credit</h2>
    <label for="company-number">Company number</label>
    <input type="text" id="company-number" placeholder="e.g. 10195922">
    <button type="button" id="check-button">Run model</button>
    <p id="check-result"></p>
  </section>

  <script>
    const STATUS_CLASS = {
      active: "status-active",
      liquidation: "status-liquidation",
      dissolved: "status-dissolved"
    };

    function textCell(value) {
      const cell = document.createElement("td");
      cell.textContent = value == null ? "" : String(value);
      return cell;
    }

    function statusCell(status) {
      const cell = textCell(status);
      const key = String(status == null ? "" : status).trim().toLowerCase();
      if (STATUS_CLASS[key]) {
        cell.className = STATUS_CLASS[key];
      }
      return cell;
    }

    function showError(message) {
      const status = document.getElementById("message");
      status.textContent = message;
      status.className = "error";
      document.getElementById("companies-table").hidden = true;
    }

    function renderItems(items) {
      const body = document.getElementById("companies-body");
      body.replaceChildren();

      items.forEach(function (item) {
        const row = document.createElement("tr");
        row.appendChild(textCell(item.company_number));
        row.appendChild(textCell(item.company_name));
        row.appendChild(textCell(item.incorporated));
        row.appendChild(statusCell(item.status_today));
        body.appendChild(row);
      });

      document.getElementById("message").hidden = true;
      document.getElementById("companies-table").hidden = false;
    }

    fetch("/api/items")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Request failed");
        }
        return response.json();
      })
      .then(function (items) {
        if (!Array.isArray(items)) {
          throw new Error("Unexpected response");
        }
        renderItems(items);
      })
      .catch(function () {
        showError("Could not load companies. Please try again later.");
      });

    function showCheckResult(message, isError) {
      const result = document.getElementById("check-result");
      result.textContent = message;
      result.className = isError ? "error" : "";
    }

    document.getElementById("check-button").addEventListener("click", function () {
      const companyNumber = document.getElementById("company-number").value.trim();
      if (companyNumber === "") {
        showCheckResult("Enter a company number.", true);
        return;
      }

      showCheckResult("Running model…", false);
      fetch("/api/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ company_number: companyNumber })
      })
        .then(function (response) {
          return response.json().then(function (data) {
            return { ok: response.ok, data: data };
          });
        })
        .then(function (result) {
          if (!result.ok) {
            showCheckResult(result.data && result.data.error ? result.data.error : "Request failed", true);
            return;
          }
          const d = result.data;
          showCheckResult(
            d.company_name + ": model predicts " + d.prediction_label +
            " (data as of " + d.as_of_date + "). Decision: " + d.decision + ".",
            false
          );
        })
        .catch(function () {
          showCheckResult("Could not run the model. Please try again later.", true);
        });
    });
  </script>
</body>
</html>
